<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>Auto</title>
<style>body{font:15px monospace;margin:12px}#log{white-space:pre-wrap;background:#111;color:#9f9;padding:10px;border-radius:4px;max-height:400px;overflow:auto}</style>
</head>
<body>
<div>Тест запустится сам через ~2 сек. Просто скопируй лог внизу через 6 секунд.</div>
<div id="log">ready</div>
<script src="https://st.max.ru/js/max-web-app.js"></script>
<script>(() => {
const logEl=document.getElementById('log');
function log(...a){ logEl.textContent += "\n[" + new Date().toTimeString().slice(0,8) + "] " + a.map(x=>String(x)).join(" "); }
const RUN=(crypto.randomUUID?crypto.randomUUID().slice(0,8):Math.random().toString(36).slice(2,10));
log("run:", RUN);
function raw(name,obj){ try{ window.webkit.messageHandlers.EventHandler.postMessage(name+":"+JSON.stringify(obj)); log("=>", name, JSON.stringify(obj).slice(0,120)); }catch(e){ log("raw throw:", e.message); } }
setTimeout(()=>{
  try{
    const qid = window.WebApp && WebApp.initDataUnsafe && WebApp.initDataUnsafe.query_id;
    log("query_id:", qid ? String(qid).slice(0,8)+"…" : "ОТСУТСТВУЕТ");
    WebApp.DeviceStorage.setItem('probe-secret-shared','SECRET-SHARED-VALUE')
      .then(()=>{
        log("SDK setItem: ok");
        raw("WebAppDeviceStorageGetKey",{requestId:"raw-NOqid-"+RUN, key:"probe-secret-shared"});
        raw("WebAppDeviceStorageGetKey",{requestId:"raw-WITHqid-"+RUN, key:"probe-secret-shared", queryId: qid});
      }).catch(e=>log("setItem err", JSON.stringify(e)));
  }catch(e){ log("err", e.message); }
}, 2000);
const t=setInterval(()=>{ if(window.WebApp && typeof WebApp.sendEvent==='function' && !WebApp.__w){
  const o=WebApp.sendEvent.bind(WebApp);
  WebApp.sendEvent=function(n,d){ log("<=", n, d); return o(n,d); };
  WebApp.__w=1; clearInterval(t); } },200);
})();</script>
</body></html>
