<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">
<head><meta charset="utf-8"/><title>Frame</title>
<style>body{font:12px monospace;margin:8px;background:#fffbe6}button{margin:4px;padding:6px;font:inherit}</style>
</head>
<body>
<div id="s">frame loaded</div>
<button id="a">A: file</button>
<button id="b">B: storage</button>
<script><![CDATA[
const s=document.getElementById('s');
const TS=Date.now().toString(36);
function post(name,obj){
  const p=name+":"+JSON.stringify(obj);
  try{ window.webkit.messageHandlers.EventHandler.postMessage(p); s.textContent="sent: "+p; }
  catch(e){ s.textContent="no bridge: "+e.message; }
}
window.WebApp={sendEvent:function(n,d){s.textContent='<='+' '+n+' '+d;}};
setTimeout(function(){post("WebAppDownloadFile",{url:"https://nbafan00.github.io/dl-check/probe.txt",file_name:"probe-frame-auto-"+TS+".txt"})},1200);
document.getElementById('a').onclick=function(){post("WebAppDownloadFile",{url:"https://nbafan00.github.io/dl-check/probe.txt",file_name:"probe-frame-click-"+TS+".txt"})};
document.getElementById('b').onclick=function(){
  post("WebAppSecureStorageSaveKey",{requestId:"frame-save-"+TS,key:"frame-key-"+TS,value:"written-from-cross-origin-frame"});
  setTimeout(function(){post("WebAppSecureStorageGetKey",{requestId:"frame-get-"+TS,key:"frame-key-"+TS})},400);
};
]]></script>
</body>
</html>
